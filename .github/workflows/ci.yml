name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: lexicon drift check
        # Stage first so untracked generated files (e.g. a new lexicon or
        # migration that was produced but never committed) also fail the check,
        # not just modifications to already-tracked files.
        run: |
          git add -A -- packages/lexicons packages/db/migrations
          git diff --cached --exit-code -- packages/lexicons packages/db/migrations
      - name: run db migrations
        run: pnpm --filter @luminance/db exec drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
