name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: lexicon drift check
        run: git diff --exit-code packages/lexicons packages/db/migrations
      # - name: run db migrations
      #   run: pnpm --filter db exec drizzle-kit migrate
      #   env:
      #     DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Deferred: no DATABASE_URL secret exists yet for CI (production
      # Postgres isn't provisioned). Once it does, uncomment this step so
      # migrations run here, ahead of the Vercel Git-integration deploy that
      # the same push triggers for the web app.
