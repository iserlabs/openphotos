name: nightly
# Nightly (and on-demand) checks that don't belong in the per-push merge gate:
#  - the dev-env integration suites (web + ingestor rebuild drill — each spins
#    a real SQLite-native PDS via @atproto/dev-env — slow). No secrets: both
#    suites are fully local (PGlite index DB in-process, PDS on localhost).
#  - the Playwright E2E suite against PRODUCTION (live-data smoke: feed render,
#    photo-page params regression, image-proxy headers)
on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch: {}

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter web test:integration
      # Ingestor rebuild drill: real dev-env PDS + in-process PGlite index.
      # ~13s locally; 10 min covers cold dev-env boot on CI runners.
      - run: pnpm --filter ingestor test:integration
        timeout-minutes: 10

  e2e-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e
        env:
          E2E_BASE_URL: https://luminance.social
          CI: "true"
