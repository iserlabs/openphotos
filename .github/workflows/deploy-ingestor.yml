name: deploy-ingestor
on:
  push:
    branches: [main]
    paths:
      - "apps/ingestor/**"
      - "packages/**"
      - "pnpm-lock.yaml"

concurrency:
  group: deploy-ingestor
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config apps/ingestor/fly.toml --dockerfile apps/ingestor/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
